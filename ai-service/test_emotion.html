<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Emotion Test</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0b1020;
        color: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.6fr);
        background:
          radial-gradient(circle at 20% 0%, rgba(34, 197, 94, 0.18), transparent 30%),
          radial-gradient(circle at 90% 20%, rgba(59, 130, 246, 0.2), transparent 28%),
          #0b1020;
      }

      main {
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      aside {
        padding: 28px;
        border-left: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 42, 0.78);
        backdrop-filter: blur(16px);
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(28px, 4vw, 48px);
        line-height: 1;
        letter-spacing: 0;
      }

      .subtle {
        color: #94a3b8;
        font-size: 14px;
      }

      .video-shell {
        position: relative;
        flex: 1;
        min-height: 420px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: #020617;
        overflow: hidden;
        border-radius: 8px;
      }

      video,
      canvas {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      video {
        transform: scaleX(-1);
      }

      #captureCanvas {
        display: none;
      }

      #landmarkCanvas {
        position: absolute;
        inset: 0;
        pointer-events: none;
        transform: scaleX(-1);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 10px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        background: #111827;
        color: #cbd5e1;
        font-size: 14px;
        font-weight: 700;
      }

      button {
        appearance: none;
        border: 1px solid rgba(148, 163, 184, 0.24);
        background: #2563eb;
        color: #fff;
        min-height: 42px;
        padding: 0 16px;
        border-radius: 8px;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #111827;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.56;
      }

      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #64748b;
      }

      .status-dot.live {
        background: #22c55e;
        box-shadow: 0 0 0 7px rgba(34, 197, 94, 0.14);
      }

      .inline {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .metric {
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(2, 6, 23, 0.52);
        border-radius: 8px;
        padding: 14px;
      }

      .metric label {
        display: block;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .metric strong {
        display: block;
        font-size: 22px;
        line-height: 1.2;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      pre {
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0;
        max-height: 260px;
        overflow: auto;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: #020617;
        border-radius: 8px;
        padding: 12px;
        color: #cbd5e1;
        font-size: 12px;
      }

      @media (max-width: 900px) {
        body {
          grid-template-columns: 1fr;
        }

        aside {
          border-left: 0;
          border-top: 1px solid rgba(148, 163, 184, 0.18);
        }

        .video-shell {
          min-height: 320px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>AI Emotion Test</h1>
        <p class="subtle">Webcam frame -> /analyze-student-frame -> emotion and engagement result</p>
      </div>

      <div class="video-shell">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="landmarkCanvas"></canvas>
        <canvas id="captureCanvas" width="320" height="240"></canvas>
      </div>

      <div class="toolbar">
        <button id="startBtn">Start camera</button>
        <button id="stopBtn" class="secondary" disabled>Stop</button>
        <button id="onceBtn" class="secondary" disabled>Analyze once</button>
        <label class="toggle">
          <input id="landmarkToggle" type="checkbox" checked />
          Landmarks
        </label>
        <div class="inline">
          <span id="dot" class="status-dot"></span>
          <span id="stateText" class="subtle">Idle</span>
        </div>
      </div>
    </main>

    <aside>
      <h2>Result</h2>
      <div class="grid">
        <div class="metric">
          <label>Emotion</label>
          <strong id="emotion">--</strong>
        </div>
        <div class="metric">
          <label>Attention</label>
          <strong id="attention">--</strong>
        </div>
        <div class="metric">
          <label>Confidence</label>
          <strong id="confidence">--</strong>
        </div>
        <div class="metric">
          <label>Source</label>
          <strong id="source">--</strong>
        </div>
      </div>
      <div class="metric">
        <label>Head pose</label>
        <strong id="pose">--</strong>
      </div>
      <pre id="raw">{}</pre>
    </aside>

    <script>
      const video = document.getElementById("video");
      const canvas = document.getElementById("captureCanvas");
      const landmarkCanvas = document.getElementById("landmarkCanvas");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const onceBtn = document.getElementById("onceBtn");
      const landmarkToggle = document.getElementById("landmarkToggle");
      const dot = document.getElementById("dot");
      const stateText = document.getElementById("stateText");
      const emotion = document.getElementById("emotion");
      const attention = document.getElementById("attention");
      const confidence = document.getElementById("confidence");
      const source = document.getElementById("source");
      const pose = document.getElementById("pose");
      const raw = document.getElementById("raw");

      let stream = null;
      let timer = null;
      let busy = false;
      let lastResult = null;
      const ANALYZE_INTERVAL_MS = 1000;
      const LANDMARK_GROUPS = [
        [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109, 10],
        [33, 246, 161, 160, 159, 158, 157, 173, 133, 155, 154, 153, 145, 144, 163, 7, 33],
        [263, 466, 388, 387, 386, 385, 384, 398, 362, 382, 381, 380, 374, 373, 390, 249, 263],
        [70, 63, 105, 66, 107, 55, 65, 52, 53, 46],
        [336, 296, 334, 293, 300, 276, 283, 282, 295, 285],
        [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185, 61],
        [78, 95, 88, 178, 87, 14, 317, 402, 318, 324, 308, 415, 310, 311, 312, 13, 82, 81, 80, 191, 78],
        [168, 6, 197, 195, 5, 4, 1, 19, 94, 2, 164]
      ];

      function setState(text, live = false) {
        stateText.textContent = text;
        dot.classList.toggle("live", live);
      }

      function updateResult(result) {
        lastResult = result;
        emotion.textContent = result.emotionLabel || result.emotion || "--";
        attention.textContent = result.attentionLabel || result.status || "--";
        confidence.textContent =
          typeof result.confidence === "number"
            ? `${Math.round(result.confidence * 100)}%`
            : "--";
        source.textContent =
          result.attentionSource || result.emotionSource || result.reason || "--";
        if (result.headPose) {
          pose.textContent = `yaw ${result.headPose.yaw}, pitch ${result.headPose.pitch}, roll ${result.headPose.roll}`;
        } else {
          pose.textContent = "--";
        }
        raw.textContent = JSON.stringify(result, null, 2);
        drawLandmarks(result);
      }

      function resizeLandmarkCanvas() {
        const rect = landmarkCanvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        landmarkCanvas.width = Math.max(1, Math.floor(rect.width * ratio));
        landmarkCanvas.height = Math.max(1, Math.floor(rect.height * ratio));
        const context = landmarkCanvas.getContext("2d");
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function clearLandmarks() {
        const context = landmarkCanvas.getContext("2d");
        const rect = landmarkCanvas.getBoundingClientRect();
        context.clearRect(0, 0, rect.width, rect.height);
      }

      function drawLandmarks(result) {
        resizeLandmarkCanvas();
        clearLandmarks();
        if (!landmarkToggle.checked || !result?.landmarks?.length) return;

        const context = landmarkCanvas.getContext("2d");
        const rect = landmarkCanvas.getBoundingClientRect();

        context.lineCap = "round";
        context.lineJoin = "round";
        context.strokeStyle = result.isFocused ? "rgba(34, 197, 94, 0.95)" : "rgba(249, 115, 22, 0.95)";
        context.lineWidth = 2.4;
        for (const group of LANDMARK_GROUPS) {
          context.beginPath();
          group.forEach((index, position) => {
            const point = result.landmarks[index];
            if (!point) return;
            const x = point.x * rect.width;
            const y = point.y * rect.height;
            if (position === 0) context.moveTo(x, y);
            else context.lineTo(x, y);
          });
          context.stroke();
        }

        context.fillStyle = "rgba(226, 232, 240, 0.92)";
        for (const point of result.landmarks) {
          context.beginPath();
          context.arc(point.x * rect.width, point.y * rect.height, 0.9, 0, Math.PI * 2);
          context.fill();
        }

        if (result.faceBox) {
          context.strokeStyle = result.isFocused ? "#22c55e" : "#f97316";
          context.lineWidth = 2;
          context.strokeRect(
            result.faceBox.x * rect.width,
            result.faceBox.y * rect.height,
            result.faceBox.w * rect.width,
            result.faceBox.h * rect.height,
          );
        }
      }

      async function analyzeFrame() {
        if (!stream || busy || video.videoWidth === 0) return;
        busy = true;
        try {
          const context = canvas.getContext("2d");
          context.drawImage(video, 0, 0, canvas.width, canvas.height);
          const image = canvas.toDataURL("image/jpeg", 0.7);
          const response = await fetch("/analyze-student-frame", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image,
              studentId: "test-student",
              sessionId: "test-session",
            }),
          });
          const result = await response.json();
          updateResult(result);
          setState("Analyzing every 1 second", true);
        } catch (error) {
          setState(error.message || "Analyze failed", false);
        } finally {
          busy = false;
        }
      }

      async function startCamera() {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 },
          audio: false,
        });
        video.srcObject = stream;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        onceBtn.disabled = false;
        setState("Camera ready", true);
        timer = window.setInterval(analyzeFrame, ANALYZE_INTERVAL_MS);
        window.setTimeout(analyzeFrame, 250);
      }

      function stopCamera() {
        if (timer) window.clearInterval(timer);
        timer = null;
        if (stream) stream.getTracks().forEach((track) => track.stop());
        stream = null;
        video.srcObject = null;
        clearLandmarks();
        startBtn.disabled = false;
        stopBtn.disabled = true;
        onceBtn.disabled = true;
        setState("Stopped", false);
      }

      startBtn.addEventListener("click", () => {
        startCamera().catch((error) => setState(error.message, false));
      });
      stopBtn.addEventListener("click", stopCamera);
      onceBtn.addEventListener("click", analyzeFrame);
      landmarkToggle.addEventListener("change", () => {
        if (lastResult) drawLandmarks(lastResult);
        else clearLandmarks();
      });
      window.addEventListener("resize", () => {
        if (lastResult) drawLandmarks(lastResult);
      });
    </script>
  </body>
</html>
